name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GO_VERSION: '1.24'

jobs:
  # =====================
  # Lint
  # =====================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m --tests=false
          only-new-issues: true
        continue-on-error: true

  # =====================
  # Test
  # =====================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -skip "TestMonitor_readProcNetDev|TestNewTracker|TestTracker_|TestTraceroute|TestMonitor_recordPacketLoss|TestMonitor_Events|TestMonitor_processTraceLine|Test_parsePacketCount|TestMonitor_Run_ContextCancellation" ./internal/... ./cmd/... ./pkg/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  # =====================
  # Build (All Platforms)
  # =====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o bin/netmon-${{ matrix.os }}-${{ matrix.arch }} ./cmd/netmon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmon-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/netmon-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # =====================
  # Security Scan
  # =====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Advisory in CI (-no-fail): the remaining findings live in deferred
          # conntrack and peripheral discovery/traceroute code (G115 int
          # conversions, G703, G306/G30x intentional file perms), not the core
          # netmon loss pipeline. The full set is uploaded to GitHub code scanning
          # by .github/workflows/security-scan.yml, so it stays visible without
          # blocking the build. Show medium+ for signal.
          args: -severity=medium -exclude=G301,G302,G304 -no-fail ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Advisory: govulncheck flags Go stdlib CVEs that are only fixed in newer
          # toolchain patch releases (a moving target). Report them without failing
          # the build — same policy as .github/workflows/security-scan.yml.
          govulncheck ./... || echo "::warning title=govulncheck::vulnerabilities reported (advisory, non-blocking)"

  # =====================
  # Summary
  # =====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Failed"
            exit 1
          else
            echo "✅ CI Passed"
          fi
