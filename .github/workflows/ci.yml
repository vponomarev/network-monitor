name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GO_VERSION: '1.26'

jobs:
  # =====================
  # Lint
  # =====================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m --tests=false
          only-new-issues: true

  # =====================
  # Test
  # =====================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -skip "TestMonitor_readProcNetDev|TestNewTracker|TestTracker_|TestTraceroute|TestMonitor_recordPacketLoss|TestMonitor_Events|TestMonitor_processTraceLine|Test_parsePacketCount|TestMonitor_Run_ContextCancellation" ./internal/... ./cmd/... ./pkg/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  # =====================
  # Build (All Platforms)
  # =====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: darwin
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o bin/netmon-${{ matrix.os }}-${{ matrix.arch }} ./cmd/netmon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: netmon-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/netmon-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # =====================
  # Security Scan
  # =====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@v2
        with:
          # Keep the legacy baseline visible while the blocking lint job rejects
          # new findings. security-scan.yml uploads the complete SARIF report.
          args: -severity=medium -exclude=G301,G302,G304 -no-fail ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # =====================
  # Summary
  # =====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    steps:
      - name: Check CI status
        run: |
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.security.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "CI failed: at least one required job finished with '$result'"
              exit 1
            fi
          done
          echo "CI passed"
