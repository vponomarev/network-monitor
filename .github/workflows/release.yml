name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)

env:
  GO_VERSION: '1.24'

permissions:
  contents: write

jobs:
  # =====================
  # Validate Tag
  # =====================
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          # Prerelease if the tag contains -alpha / -beta / -rc
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  # =====================
  # Build netmon binaries
  # =====================
  build-netmon:
    name: Build netmon-${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Rebuild & embed eBPF objects
        # netmon embeds pkg/embedded/bpf/*.o via //go:embed. Rebuild from source
        # and refresh the embed location so a release never ships a stale object
        # that lags behind bpf/*.c. Only clang/llvm + libbpf headers are needed —
        # no kernel-versioned packages (they don't exist for the runner kernel).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          make -C bpf all
          cp bpf/conntrack.bpf.o bpf/tcploss.bpf.o pkg/embedded/bpf/

      - name: Build binary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w \
              -X main.Version=${VERSION} \
              -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X main.GitCommit=$(git rev-parse --short HEAD)" \
            -o netmon-${{ matrix.os }}-${{ matrix.arch }} ./cmd/netmon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmon-${{ matrix.os }}-${{ matrix.arch }}
          path: netmon-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  # =====================
  # Create GitHub Release
  # =====================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, build-netmon]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Assemble release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            bin="downloaded/netmon-linux-${arch}/netmon-linux-${arch}"
            # Raw binary + checksum (for direct download)
            cp "$bin" "dist/netmon-linux-${arch}"
            chmod +x "dist/netmon-linux-${arch}"

            # Runnable bundle: binary + config files + systemd unit + prod guide
            stage="netmon-${VERSION}-linux-${arch}"
            mkdir -p "dist/${stage}/configs"
            cp "$bin" "dist/${stage}/netmon"
            chmod +x "dist/${stage}/netmon"
            cp configs/config.example.yaml    "dist/${stage}/configs/config.yaml"
            cp configs/roles.example.yaml     "dist/${stage}/configs/roles.yaml"
            cp configs/locations.example.yaml "dist/${stage}/configs/locations.yaml"
            cp configs/topology.example.yaml  "dist/${stage}/configs/topology.yaml"
            cp packaging/netmon.service       "dist/${stage}/netmon.service"
            cp docs/PRODUCTION_en.md          "dist/${stage}/PRODUCTION.md"
            tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
            rm -rf "dist/${stage}"
          done

          # Single checksums file over all published assets
          ( cd dist && sha256sum netmon-linux-* *.tar.gz > checksums.txt )
          echo "=== release assets ==="
          ls -la dist/

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: |
            {
              "categories": [
                { "title": "🚀 Features", "labels": ["feature", "enhancement"] },
                { "title": "🐛 Bug Fixes", "labels": ["bug", "fix"] },
                { "title": "📝 Documentation", "labels": ["documentation"] },
                { "title": "🔧 Maintenance", "labels": ["chore", "refactor"] }
              ],
              "ignore_labels": ["skip-changelog"]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.validate.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Installation (netmon — TCP loss monitoring)

            Download the bundle for your architecture — it contains the `netmon`
            binary, example configs, and a systemd unit.

            ```bash
            # amd64 (replace with -arm64 on ARM hosts)
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/netmon-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz
            tar -xzf netmon-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz
            cd netmon-${{ needs.validate.outputs.version }}-linux-amd64

            sudo install -m 0755 netmon /usr/local/bin/netmon
            sudo mkdir -p /etc/netmon
            sudo cp configs/*.yaml /etc/netmon/
            sudo cp netmon.service /etc/systemd/system/netmon.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now netmon

            curl -s http://localhost:9876/ready
            ```

            Prefer just the binary? Download `netmon-linux-amd64` / `netmon-linux-arm64` directly.

            ## 🔍 Verify checksums

            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/checksums.txt
            sha256sum -c checksums.txt --ignore-missing
            ```

            ## 📖 Documentation

            - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Production Deployment Guide (EN)](https://github.com/${{ github.repository }}/blob/main/docs/PRODUCTION_en.md)
            - [Production Deployment Guide (RU)](https://github.com/${{ github.repository }}/blob/main/docs/PRODUCTION_ru.md)

            > **Requirements:** Linux kernel 5.8+ with BTF (`/sys/kernel/btf/vmlinux`).
            > Recommended capabilities: `CAP_SYS_ADMIN CAP_NET_RAW` (see the guide).
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: |
            dist/netmon-linux-amd64
            dist/netmon-linux-arm64
            dist/netmon-*-linux-amd64.tar.gz
            dist/netmon-*-linux-arm64.tar.gz
            dist/checksums.txt
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
