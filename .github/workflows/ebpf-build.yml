name: eBPF Build & Verify

on:
  push:
    branches: [main, master]
    paths:
      - 'bpf/**'
      - 'pkg/embedded/**'
      - 'internal/losscollector/**'
      - 'internal/conntrack/**'
      - 'cmd/conntrack/**'
      - 'configs/conntrack.example.yaml'
      - 'packaging/systemd/conntrack.service'
      - '.github/workflows/ebpf-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'bpf/**'
      - 'pkg/embedded/**'
      - 'internal/losscollector/**'
      - 'internal/conntrack/**'
      - 'cmd/conntrack/**'
      - 'configs/conntrack.example.yaml'
      - 'packaging/systemd/conntrack.service'
      - '.github/workflows/ebpf-build.yml'

env:
  GO_VERSION: '1.24'

jobs:
  # Build the eBPF objects from source, verify they load on the runner kernel,
  # and confirm the Go event structs still match the compiled C structs.
  build-and-verify:
    name: Build, smoke-load & struct-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          # clang/llvm compile the programs; libbpf-dev provides bpf/bpf_helpers.h.
          sudo apt-get install -y clang llvm libbpf-dev
          # bpftool must be kernel-INDEPENDENT: GitHub runners use an -azure kernel
          # whose linux-tools-$(uname -r) package does not exist, and the
          # /usr/sbin/bpftool wrapper from linux-tools-common exits non-zero when it
          # can't find a version-matched binary. The standalone `bpftool` package
          # (Ubuntu 22.10+) ships a self-contained binary; fall back to the generic
          # linux-tools symlink only if that package is unavailable.
          if ! sudo apt-get install -y bpftool; then
            sudo apt-get install -y linux-tools-generic
            sudo ln -sf "$(ls -d /usr/lib/linux-tools-*/bpftool | tail -1)" /usr/local/bin/bpftool
          fi
          clang --version
          # Don't fail the step on the wrapper's advisory warning; the load step
          # below is the real gate.
          bpftool version || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build eBPF objects from source
        run: |
          # NOTE: use the explicit `all` target — bare `make` regenerates
          # vmlinux.h. We build against the committed (trimmed) bpf/vmlinux.h.
          make -C bpf all
          echo "--- built objects ---"
          ls -la bpf/*.o
          file bpf/*.o

      - name: Verify committed embedded objects are not stale
        run: |
          # Releases rebuild eBPF from source, so a byte diff here is advisory,
          # not fatal (compiler versions differ). Warn loudly if it drifts so a
          # maintainer refreshes pkg/embedded/bpf/*.o.
          cp bpf/conntrack.bpf.o bpf/tcploss.bpf.o pkg/embedded/bpf/
          if ! git diff --quiet -- pkg/embedded/bpf/; then
            echo "::warning title=Embedded eBPF drift::pkg/embedded/bpf/*.o differs from a fresh build. Rebuild and commit: make -C bpf all && cp bpf/*.bpf.o pkg/embedded/bpf/"
            git --no-pager diff --stat -- pkg/embedded/bpf/ || true
          else
            echo "Committed embedded objects match a fresh build."
          fi

      - name: Smoke-load TCP-loss program (verifier + CO-RE on runner kernel)
        # tcploss is the production netmon data path. Unlike the deferred
        # conntrack program below, verifier/CO-RE failure blocks the build on
        # kernels in our supported matrix (5.8 through 6.12). GitHub-hosted
        # runners can move ahead of that matrix without notice; those kernels
        # are reported and skipped instead of redefining product support.
        run: |
          kernel_release="$(uname -r)"
          kernel_major="${kernel_release%%.*}"
          kernel_rest="${kernel_release#*.}"
          kernel_minor="${kernel_rest%%.*}"
          echo "runner kernel: ${kernel_release}"

          if (( kernel_major > 6 || (kernel_major == 6 && kernel_minor > 12) )); then
            echo "::warning title=tcploss eBPF load::Skipping verifier/load on unsupported runner kernel ${kernel_release}; blocking load coverage is provided by the 5.15/6.1/6.8/6.12 qualification matrix."
            exit 0
          fi

          sudo mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
          sudo rm -rf /sys/fs/bpf/_ci 2>/dev/null || true
          sudo bpftool prog loadall bpf/tcploss.bpf.o /sys/fs/bpf/_ci
          sudo bpftool prog show | grep -E 'tracepoint' | head
          echo "tcploss.bpf.o loaded successfully on $(uname -r)."
          sudo rm -rf /sys/fs/bpf/_ci 2>/dev/null || true

      - name: Verify canonical conntrack assets are embedded
        run: |
          cmp configs/conntrack.example.yaml pkg/embedded/configs/conntrack.example.yaml
          cmp packaging/systemd/conntrack.service pkg/embedded/systemd/conntrack.service

      - name: Smoke-load conntrack program (blocking on supported kernels)
        run: |
          kernel_release="$(uname -r)"
          kernel_major="${kernel_release%%.*}"
          kernel_rest="${kernel_release#*.}"
          kernel_minor="${kernel_rest%%.*}"
          if (( kernel_major > 6 || (kernel_major == 6 && kernel_minor > 12) )); then
            echo "::warning title=conntrack eBPF load::Skipping verifier/load on unsupported runner kernel ${kernel_release}; blocking coverage is provided by the 5.15/6.1/6.8/6.12 matrix."
            exit 0
          fi

          sudo rm -rf /sys/fs/bpf/_ci 2>/dev/null || true
          sudo bpftool prog loadall bpf/conntrack.bpf.o /sys/fs/bpf/_ci
          echo "conntrack.bpf.o loaded successfully on ${kernel_release}."
          sudo rm -rf /sys/fs/bpf/_ci 2>/dev/null || true

      - name: Verify Go loss-event struct matches freshly built object
        run: |
          # The linux collector validates its event layout against the C struct
          # (validateBpfLossEvent) and parses synthetic events.
          go test -run 'Validate|HandleRecord' -v ./internal/losscollector/...

      - name: Upload eBPF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-objects
          path: bpf/*.o
          retention-days: 7
