version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - errname
    - errorlint
    - gosec
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - tparallel
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      excludes:
        - G304
        # Integer conversions below are range-checked at config/API boundaries;
        # generated eBPF/config artifacts are intentionally operator-readable.
        - G115
        - G306
    govet:
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
          arguments:
            - - ID
              - API
              - URL
              - eBPF
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - unused
        path: internal/conntrack/ebpf
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
