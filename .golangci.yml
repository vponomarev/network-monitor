version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - contextcheck
    - errname
    - errorlint
    - gosec
    - misspell
    - nakedret
    - nilerr
    - predeclared
    - revive
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      excludes:
        - G304
    govet:
      disable:
        - fieldalignment
        - shadow
        - unusedwrite
      enable-all: true
    # gocritic's opinionated bundle and noctx currently report a large legacy
    # migration backlog (mostly tests/install tooling). Keep correctness-focused
    # contextcheck, revive, unparam and full govet blocking; migrate the other
    # two separately instead of hiding their findings behind broad exclusions.
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
          arguments:
            - - ID
              - API
              - URL
              - eBPF
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - unused
        path: internal/conntrack/ebpf
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
