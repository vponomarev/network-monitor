# Roles Configuration Example
# Maps IP ranges to logical roles.
#
# Use `network` for one CIDR or `networks` for multiple CIDRs with the same
# role. The fields are mutually exclusive. Host-specific roles normally use
# /32 (IPv4) or /128 (IPv6).

roles:
  # Application hosts grouped under one role
  - role: app-server
    networks:
      - 192.168.20.10/32
      - 192.168.20.11/32
      - 192.168.20.12/32
      - 192.168.20.13/32
      - 192.168.20.14/32

  # Inline YAML lists are also supported
  - role: load-balancer
    networks: [192.168.200.1/32, 192.168.200.2/32, 192.168.200.3/32]

  # Another host-oriented role
  - role: storage-server
    networks:
      - 192.168.40.10/32
      - 192.168.40.11/32
      - 192.168.40.12/32

  # Legacy single-network entries remain supported
  - network: 192.168.60.10/32
    role: backup-server

