# Locations Configuration Example
# Maps IP ranges to physical locations and VRFs.
#
# Use `network` for one CIDR or `networks` for multiple CIDRs with identical
# location, hostname, and VRF attributes. The fields are mutually exclusive.

locations:
  # Several production subnets in the same datacenter
  - location: datacenter-a
    vrf: production
    networks:
      - 192.168.0.0/20
      - 192.168.32.0/23
      - 192.168.50.0/24

  # Inline YAML lists are also supported
  - location: datacenter-b
    vrf: management
    networks: [192.168.60.0/24, 192.168.70.0/24]

  # Legacy single-network entries remain supported
  - network: 192.168.80.0/24
    location: datacenter-c
    vrf: production

  # A more specific host entry wins by longest-prefix match
  - network: 192.168.60.10/32
    location: datacenter-b
    hostname: app-server-01
    vrf: management

