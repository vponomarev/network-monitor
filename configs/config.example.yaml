# Network Monitor Configuration Example
# Copy to config.yaml and customize

global:
  ttl_hours: 3
  metrics_port: 9876
  metrics_addr: 0.0.0.0       # Bind address for HTTP server (default: 0.0.0.0)
  # auth_token: ""            # Optional: Bearer token for /metrics and /api/* endpoints
                              # Can also be set via NETMON_AUTH_TOKEN environment variable
                              # /health and /ready are NEVER protected
  # TCP-loss data source:
  #   ebpf      — eBPF tracepoint tcp_retransmit_skb via ring buffer (DEFAULT, production)
  #   tracepipe — legacy text scrape of trace_pipe (fallback/debug; single global consumer)
  loss_source: ebpf
  # trace_pipe_path is only used when loss_source: tracepipe
  trace_pipe_path: /sys/kernel/tracing/trace_pipe

metadata:
  locations:
    path: locations.yaml
    # Optional: HTTP update source for automatic updates
    # First poll happens 30 seconds after startup, then at poll_interval
    # update_source:
    #   url: https://config.example.com/locations.yaml
    #   poll_interval: 20m  # Check every 20 minutes (default)
    #   timeout: 10s        # HTTP request timeout

  roles:
    path: roles.yaml
    # Optional: HTTP update source
    # update_source:
    #   url: https://config.example.com/roles.yaml
    #   poll_interval: 20m
    #   timeout: 10s

  topology:
    path: topology.yaml
    # Optional: HTTP update source (topology changes rarely)
    # update_source:
    #   url: https://config.example.com/topology.yaml
    #   poll_interval: 60m  # Check every hour
    #   timeout: 10s

  # Bounded inventory of IPs observed in loss events but absent from role,
  # location, or VRF metadata. Per-IP series are exposed only on the separate
  # /metrics/metadata/unknown endpoint.
  unknown:
    enabled: true
    ttl: 3h
    max_ips: 10000

# HTTP Update Source Behavior:
# - Local file is REQUIRED for startup (fail-fast if missing)
# - HTTP polling is OPTIONAL
# - First poll: 30 seconds after startup
# - Validation: type-specific (locations/roles/topology)
# - Auto-reload: memory updated after successful file update
# - Atomic writes: write to temp file + rename
# - Metrics: metadata_update_total, metadata_update_errors_total,
#            metadata_last_update_timestamp_seconds, metadata_last_hash
# - API: GET /api/v1/metadata/status for source status

discovery:
  traceroute:
    enabled: true
    top_n: 10
    mode: both  # both | top_loss | on_demand | periodic
    interval: 5m
    # Traceroute-specific settings
    protocol: icmp        # icmp | udp | tcp
    max_hops: 30          # Maximum TTL
    timeout: 3s           # Per-probe timeout
    probes_per_hop: 3     # Probes per TTL value
    start_ttl: 1          # Starting TTL
    dst_port: 33434       # Destination port for UDP/TCP traceroute
    src_port: 0           # Source port (0 = auto) for TCP traceroute
    tcp_flags: S          # TCP flags: S=SYN, A=ACK, F=FIN, R=RST (for TCP traceroute)

topology:
  enabled: false          # Enable topology enrichment
  path: topology.yaml     # Path to topology YAML file

metrics:
  name: netmon_tcp_loss_total
  default_labels:
    - src_ip
    - dst_ip
    - src_location
    - dst_location
    - src_role
    - dst_role
    - src_vrf
    - dst_vrf
  # Optional labels are opt-in: omitted labels are not exported.
  optional_labels:
    - src_network
    - dst_network
  # src_vrf/dst_vrf are resolved from the vrf field in locations.yaml. They
  # remain available at cardinality level role even when src_ip/dst_ip are
  # removed from this allowlist.
  # Cardinality control for netmon_tcp_loss_total (protects Prometheus from OOM).
  cardinality:
    # level:
    #   role    — aggregate by location/role/vrf, NO per-IP labels (DEFAULT, production-safe)
    #   network — aggregate by /24 network (no per-IP labels)
    #   ip      — full src_ip/dst_ip labels (UNBOUNDED cardinality; only for small/known IP spaces)
    level: role
    # Hard cap on the number of active series. New series beyond this are dropped
    # and counted in netmon_loss_series_dropped_total. 0 = unlimited (not recommended).
    max_series: 10000

logging:
  level: info
  format: json

# Connection tracking (eBPF-based)
connections:
  enabled: true
  track_incoming: true
  track_outgoing: true
  filter_ports: []
  event_buffer_size: 10000  # Buffer size for connection events (default: 10000)
  state_ttl: 24h            # Expire orphaned kernel/userspace state
  cleanup_interval: 1m      # Retention sweep cadence
  max_tracked_connections: 10240
  max_pending_connections: 16384

# Optional monitoring modules (disabled by default)
# Uncomment and configure to enable

